[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-ai-gateway"
version = "1.2.0"
description = "OpenAI-compatible gateway chaining free-tier LLM providers. (c) 2026 Mourad Soltani Technologies (TM) @MST."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mourad Soltani", email = "noreply@example.com" },
]
maintainers = [
    { name = "Mourad Soltani Technologies (TM) @MST", email = "noreply@example.com" },
]
keywords = ["llm", "gateway", "litellm", "openai", "rate-limit", "proxy", "mst"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "litellm[proxy]>=1.40.0,<2.0.0",
    "openai>=1.30.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
free-ai-gateway = "client:main"
free-ai-gateway-health = "healthcheck:main"

[project.urls]
Homepage   = "https://github.com/mouradsoltani/free-ai-gateway"
Issues     = "https://github.com/mouradsoltani/free-ai-gateway/issues"
Changelog  = "https://github.com/mouradsoltani/free-ai-gateway/blob/main/CHANGELOG.md"
Commercial = "https://github.com/mouradsoltani/free-ai-gateway/blob/main/COMMERCIAL.md"

[tool.setuptools]
py-modules = ["tracker", "client", "async_client", "healthcheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
